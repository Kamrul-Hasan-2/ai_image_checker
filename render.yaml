services:
  - type: web
    name: ai-image-checker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: TRANSFORMERS_CACHE
        value: /root/.cache/huggingface
      - key: TORCH_HOME
        value: /root/.cache/torch
