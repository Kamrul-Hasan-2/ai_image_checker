# Nginx configuration example for reverse proxy
# Place this in /etc/nginx/sites-available/ais.bdstall.com

server {
    listen 80;
    server_name ais.bdstall.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ais.bdstall.com;

    # SSL configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/ais.bdstall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ais.bdstall.com/privkey.pem;

    # Forward /image_checker to your FastAPI app
    location /image_checker {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running AI operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Allow JSON body up to 50MB for base64 images
        client_max_body_size 50M;
    }

    # Optional: Add root location for other content
    location / {
        root /var/www/ais.bdstall.com;
        index index.html;
    }
}
