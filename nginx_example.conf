# Nginx configuration example for reverse proxy
# Place this in /etc/nginx/sites-available/ais.bdstall.com

server {
    listen 80;
    server_name ais.bdstall.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ais.bdstall.com;

    # SSL configuration (adjust paths as needed)
    ssl_certificate /etc/letsencrypt/live/ais.bdstall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ais.bdstall.com/privkey.pem;

    # Forward the moderation endpoints to the FastAPI app.
    # This allows other services to run on the root domain.
    #
    # Matches /image_checker, /weight_checker and the /api/moderation_ai/*
    # aliases BDStall calls (the app registers all of these paths itself, so no
    # rewrite is needed — just make sure the location block forwards them).
    location ~ ^/(image_checker|weight_checker|api/moderation_ai/) {
        # Don't add trailing slash in proxy_pass
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase timeout for long-running AI operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # Allow JSON body up to 50MB for base64 images
        client_max_body_size 50M;
    }

    # Root location for other services (modify as needed)
    location / {
        # Your other service configuration here
        # Example: proxy to another app, serve static files, etc.
        root /var/www/ais.bdstall.com;
        index index.html;
    }
}
