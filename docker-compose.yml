version: '3.8'

services:
  ai-image-checker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-image-checker
    ports:
      - "8000:8000"
    environment:
      # Set to 'cuda' if you have NVIDIA GPU support
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-}
      # HuggingFace cache directory
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
    volumes:
      # Mount model cache to persist downloads between restarts
      - huggingface-cache:/app/.cache/huggingface
      # Optional: mount code for development (comment out for production)
      # - ./:/app
    restart: unless-stopped
    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    # Uncomment for GPU support (requires nvidia-docker)
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  huggingface-cache:
    driver: local
